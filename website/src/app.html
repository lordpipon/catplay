<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48x48.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="%sveltekit.assets%/android-chrome-192x192.png"
		/>

		<title>Catplay</title>
		<meta name="description" content="A realistic crypto trading simulator — create coins, trade with liquidity pools, play arcade games like Chicken Road, and learn about 'rug pulls' in a safe environment." />

		<!-- Link embed tags (Discord/Twitter/etc). App is client-rendered, so these live here. -->
		<meta property="og:title" content="Catplay — the fake crypto simulator" />
		<meta property="og:description" content="A realistic crypto trading simulator. Create coins, trade with liquidity pools, predict on questions, and play arcade games — all with virtual money." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://catplay.dpdns.org/" />
		<meta property="og:image" content="https://catplay.dpdns.org/apple-touch-icon.png" />
		<meta property="og:image:alt" content="Catplay Logo" />
		<meta property="og:site_name" content="Catplay" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Catplay — the fake crypto simulator" />
		<meta name="twitter:description" content="Create coins, trade with liquidity pools, and play arcade games — all with virtual money." />
		<meta name="twitter:image" content="https://catplay.dpdns.org/apple-touch-icon.png" />
		<!-- Global Meta Tags -->
		<meta name="application-name" content="Catplay" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="apple-mobile-web-app-title" content="Catplay" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Preconnect to external domains for performance -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
